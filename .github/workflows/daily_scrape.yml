name: Daily APIx Scrape & Index Publication

# APIx — National Airfare Price Index for India (MoSPI/RBI POC)
# Runs the collection -> pipeline -> index chain daily, then commits the
# refreshed CSV artifacts (data_scraped_raw.csv, data_master.csv,
# daily_index.csv) back to the repository so the public dashboard and the
# e-Sankhyiki-style API always serve the freshest official series.

on:
  schedule:
    - cron: "0 0 * * *" # 00:00 UTC daily (05:30 IST — start of the Indian stats day)
  workflow_dispatch: {} # manual runs for demos, backfills, and debugging

permissions:
  contents: write # required to push refreshed CSVs back to the repo

concurrency:
  group: daily-scrape
  cancel-in-progress: false # never drop a scheduled publication

jobs:
  collect-and-publish:
    name: Collect airfares, rebuild APIx, commit artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Live scraping is best-effort; scraper.py fails over to synthetic data
      # so the pipeline and the published index NEVER break in CI or demos.
      APIX_FALLBACK_ONLY: "false"
      TZ: Asia/Kolkata

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install Playwright Chromium browser
        run: python -m playwright install --with-deps chromium

      - name: Scrape live airfares (5 DGCA corridors x T+1/T+7/T+15)
        working-directory: backend
        run: |
          if [ "$APIX_FALLBACK_ONLY" = "true" ]; then
            python scraper.py --fallback-only
          else
            # scraper.py auto-falls back to synthetic data on any failure.
            python scraper.py
          fi

      - name: Clean data and synthesise 30-day master dataset
        working-directory: backend
        run: python pipeline.py

      - name: Compute Laspeyres APIx (Base 2024=100)
        working-directory: backend
        run: python index_engine.py

      - name: Fit ARIMA forecasts (all scopes, 7-day horizon)
        working-directory: backend
        run: python forecast_engine.py --all --horizon 7

      - name: Upload artifacts (always, for forensic/debug access)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apix-artifacts-${{ github.run_id }}
          path: |
            backend/data_scraped_raw.csv
            backend/data_master.csv
            backend/daily_index.csv
            backend/forecast.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit refreshed CSV artifacts
        run: |
          git config user.name "apix-bot[bot]"
          git config user.email "apix-bot[bot]@users.noreply.github.com"
          git add backend/data_scraped_raw.csv backend/data_master.csv backend/daily_index.csv backend/forecast.json
          if git diff --cached --quiet; then
            echo "No data changes detected — skipping empty commit."
          else
            STAMP="$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
            AP=$(awk -F, 'END {print $3}' backend/daily_index.csv)
            git commit -m "data: APIx daily publication ${STAMP} (APIx=${AP})"
            git push
          fi
