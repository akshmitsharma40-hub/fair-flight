# FAIR FLIGHT — Render.com blueprint (free tier friendly).
# Deploy both services with:  render blueprint launch   (or push to a connected repo)
# Frontend → https://fair-flight.onrender.com  · Backend → https://fair-flight-api.onrender.com

services:
  - type: web
    name: fair-flight-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: WEBHOOK_SECRET
        generateValue: true          # HMAC signing for tokens + webhooks
      - key: PYTHON_VERSION
        value: 3.12.6
    plan: free

  - type: web
    name: fair-flight-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback — client routes/hash permalinks resolve to index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=2592000, immutable
    envVars:
      # The dashboard calls the API absolutely; keep in sync with the api service URL.
      - key: VITE_API_BASE
        value: https://fair-flight-api.onrender.com
    plan: free
