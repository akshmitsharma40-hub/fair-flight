<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="1" stop-color="#0b1024"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#67e8f9"/>
    </marker>
  </defs>

  <rect width="1240" height="720" fill="url(#bg)"/>
  <rect width="1240" height="720" fill="url(#glow1)"/>
  <rect width="1240" height="720" fill="url(#glow2)"/>
  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <path d="M0 120 H1240 M0 280 H1240 M0 440 H1240 M0 600 H1240"/>
    <path d="M200 0 V720 M480 0 V720 M760 0 V720 M1040 0 V720"/>
  </g>

  <!-- Masthead -->
  <g transform="translate(60,48)">
    <rect width="46" height="46" rx="11" fill="url(#tile)"/>
    <g fill="#ffffff" transform="translate(7,7) scale(1)">
      <path d="M2 1 h10 l-3 4 h-4 v3 h5 l-3 4 h-2 v5 h-3 z" transform="scale(0.9)"/>
    </g>
    <text x="62" y="22" fill="#f8fafc" font-size="24" font-weight="800" letter-spacing="3">FAIR FLIGHT</text>
    <text x="62" y="40" fill="#94a3b8" font-size="12.5">Real-time Airfare Price Index for India · CPI Augmentation · MoSPI / RBI</text>
    <text x="62" y="56" fill="#64748b" font-size="11">COICOP-2018 Division 07 (07.3.1.2) · Base Year 2024=100 · Laspeyres fixed basket</text>
  </g>
  <rect x="60" y="126" width="1120" height="2" fill="url(#flow)" opacity="0.7"/>

  <!-- Row 1: collection -->
  <g transform="translate(60,168)">
    <rect width="340" height="128" rx="14" fill="#0e1630" stroke="#273459" stroke-width="1.2"/>
    <text x="20" y="28" fill="#7dd3fc" font-size="12" font-weight="700" letter-spacing="1.5">1 · COLLECTION — DAILY 05:30 IST</text>
    <text x="20" y="52" fill="#e2e8f0" font-size="13.5" font-weight="600">scraper.py — async Playwright</text>
    <text x="20" y="72" fill="#94a3b8" font-size="11.5">5 DGCA corridors × T+1 / T+7 / T+15</text>
    <text x="20" y="90" fill="#94a3b8" font-size="11.5">anti-bot headers · randomized delays</text>
    <text x="20" y="108" fill="#64748b" font-size="11">fallback: realistic synthetic generator</text>
    <text x="20" y="122" fill="#475569" font-size="10.5">→ data_scraped_raw.csv</text>
  </g>
  <g transform="translate(450,168)">
    <rect width="340" height="128" rx="14" fill="#0e1630" stroke="#273459" stroke-width="1.2"/>
    <text x="20" y="28" fill="#7dd3fc" font-size="12" font-weight="700" letter-spacing="1.5">2 · CLEANING &amp; SYNTHESIS</text>
    <text x="20" y="52" fill="#e2e8f0" font-size="13.5" font-weight="600">pipeline.py — pandas</text>
    <text x="20" y="72" fill="#94a3b8" font-size="11.5">outlier filter &gt; ₹25k · best economy fare</text>
    <text x="20" y="90" fill="#94a3b8" font-size="11.5">30-day DGCA-baseline history (±10%)</text>
    <text x="20" y="108" fill="#64748b" font-size="11">base fares + taxes split retained</text>
    <text x="20" y="122" fill="#475569" font-size="10.5">→ data_master.csv</text>
  </g>
  <g transform="translate(840,168)">
    <rect width="340" height="128" rx="14" fill="#0e1630" stroke="#273459" stroke-width="1.2"/>
    <text x="20" y="28" fill="#7dd3fc" font-size="12" font-weight="700" letter-spacing="1.5">3 · INDEX COMPUTATION</text>
    <text x="20" y="52" fill="#e2e8f0" font-size="13.5" font-weight="600">index_engine.py — Laspeyres</text>
    <text x="20" y="72" fill="#94a3b8" font-size="11.5">route weights (35/25/20/10/10)</text>
    <text x="20" y="90" fill="#94a3b8" font-size="11.5">window weights (15/35/50)</text>
    <text x="20" y="108" fill="#64748b" font-size="11">anchored to exactly 100.00</text>
    <text x="20" y="122" fill="#475569" font-size="10.5">→ daily_index.csv</text>
  </g>

  <g stroke="url(#flow)" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M400 232 H446"/>
    <path d="M790 232 H836"/>
  </g>

  <!-- Row 2: serving + intelligence -->
  <g transform="translate(60,336)">
    <rect width="540" height="150" rx="14" fill="#101a38" stroke="#3b4a7a" stroke-width="1.4"/>
    <text x="20" y="28" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing="1.5">4 · SERVING — FastAPI (e-Sankhyiki-style)</text>
    <text x="20" y="54" fill="#e2e8f0" font-size="13.5" font-weight="600">api.py : 8000</text>
    <text x="20" y="76" fill="#94a3b8" font-size="11.5">/latest · /history · /forecast · /stream (SSE) · /webhooks (HMAC)</text>
    <text x="20" y="94" fill="#94a3b8" font-size="11.5">/auth (PBKDF2 + bearer) · /policy-sim · /backtest · /bulletin.pdf</text>
    <text x="20" y="112" fill="#64748b" font-size="11">API-key tiers · sliding-window rate limits · COICOP metadata injected</text>
    <text x="20" y="134" fill="#475569" font-size="10.5">forecast_engine.py (ARIMA) · analytics_engine.py · pdf_bulletin.py</text>
  </g>
  <g transform="translate(640,336)">
    <rect width="540" height="150" rx="14" fill="#101a38" stroke="#3b4a7a" stroke-width="1.4"/>
    <text x="20" y="28" fill="#6ee7b7" font-size="12" font-weight="700" letter-spacing="1.5">5 · INTELLIGENCE — research &amp; policy</text>
    <text x="20" y="54" fill="#e2e8f0" font-size="13.5" font-weight="600">Hannan–Rissanen ARIMA + walk-forward validation</text>
    <text x="20" y="76" fill="#94a3b8" font-size="11.5">AIC-selected orders · 95% prediction bands · 12-fold backtest</text>
    <text x="20" y="94" fill="#94a3b8" font-size="11.5">policy simulator: ATF / demand / GST shocks → APIx → CPI bps</text>
    <text x="20" y="112" fill="#64748b" font-size="11">Paasche &amp; Fisher companions · seasonal decomposition · ATF correlation</text>
    <text x="20" y="134" fill="#475569" font-size="10.5">client-side mirrors label themselves when the API is offline</text>
  </g>

  <g stroke="url(#flow)" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M330 296 V332"/>
    <path d="M600 411 H636"/>
  </g>

  <!-- Row 3: frontend -->
  <g transform="translate(60,526)">
    <rect width="1120" height="140" rx="14" fill="#0d1430" stroke="#3d5a8a" stroke-width="1.5"/>
    <text x="20" y="28" fill="#7dd3fc" font-size="12" font-weight="700" letter-spacing="1.5">6 · EXPERIENCE — React 19 + TypeScript + Tailwind + Recharts + Framer Motion</text>
    <text x="20" y="56" fill="#e2e8f0" font-size="13.5" font-weight="600">FAIR FLIGHT dashboard</text>
    <g fill="#94a3b8" font-size="11.5">
      <text x="20" y="80">⌘K palette · tools flyout · corridor map · time-travel scrubber</text>
      <text x="360" y="80">policy simulator · research panel · alert center</text>
      <text x="700" y="80">analyst chatbot · About encyclopedia · guided tour</text>
      <text x="20" y="100">dark/light aurora themes · EN⇄हिन्दी · permalinks · PWA offline</text>
      <text x="360" y="100">sign-in tiers · HMAC webhooks · bulletin PDF</text>
      <text x="700" y="100">SSE live ribbon · anomaly banner</text>
    </g>
    <text x="20" y="126" fill="#475569" font-size="10.5">API-first with deterministic snapshot fallback — the demo never breaks</text>
  </g>

  <g stroke="url(#flow)" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M330 486 V522"/>
  </g>

  <!-- Footnote -->
  <text x="620" y="700" fill="#3e4c6e" font-size="11" text-anchor="middle">
    GitHub Actions cron (0 0 * * *) drives the daily pipeline · CSV artifacts committed back to the repo · every layer degrades gracefully
  </text>
</svg>
