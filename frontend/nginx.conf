server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routes and hash permalinks resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the institutional API to the backend container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE support: disable buffering + long timeouts for the live stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Static asset caching (Vite fingerprints these).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
